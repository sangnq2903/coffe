name: canxe_app
description: Ứng dụng cân xe — chạy trên web, Windows và điện thoại.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  canxe_shared:
    path: ../shared
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  pdf: ^3.11.3
  printing: ^5.14.3
  path_provider: ^2.1.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Roboto (Apache 2.0, lấy từ Flutter SDK) được nhúng để phiếu cân in ra có
  # đầy đủ dấu tiếng Việt — font mặc định của thư viện PDF không có dấu.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

  # Roboto Condensed dùng riêng cho các con số: số cân, tiền, cột số trong bảng.
  # Chữ hẹp nên bảng 31 cột ngày vẫn đọc được, và số cân nhìn ra dáng mặt đồng
  # hồ đo chứ không lẫn vào chữ thường. Nhúng sẵn vì máy ở kho phải chạy được
  # khi mất mạng — không tải font từ Internet.
  fonts:
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
