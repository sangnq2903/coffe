  http: ^1.2.2
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  sqlite3: ^2.4.6
  web_socket_channel: ^3.0.1
  excel: ^4.0.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
